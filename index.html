<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shamikh | شامخ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="rtl">

<!-- HEADER -->
<header>
  <div class="logo">
    <span>SHAMIKH</span>
    <span class="logo-ar">| شامخ</span>
  </div>
  <nav>
    <a href="#home" data-i18n="nav.home"></a>
    <a href="#about" data-i18n="nav.about"></a>
    <a href="#products" data-i18n="nav.products"></a>
    <a href="#contact" data-i18n="nav.contact"></a>
    <button class="lang-toggle" onclick="toggleLang()">EN</button>
    <button class="cart-btn" onclick="openCart()">
      🛒
      <span class="cart-count">0</span>
    </button>
    <button class="menu-btn" onclick="toggleMobileMenu()">
      <span></span><span></span><span></span>
    </button>
  </nav>
</header>

<!-- MOBILE MENU -->
<div class="mobile-menu">
  <a href="#home" data-i18n="nav.home" onclick="toggleMobileMenu()"></a>
  <a href="#about" data-i18n="nav.about" onclick="toggleMobileMenu()"></a>
  <a href="#products" data-i18n="nav.products" onclick="toggleMobileMenu()"></a>
  <a href="#contact" data-i18n="nav.contact" onclick="toggleMobileMenu()"></a>
  <button class="lang-toggle" onclick="toggleLang(); toggleMobileMenu()">EN</button>
</div>

<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-content">
    <div class="hero-badge" data-i18n="hero.badge"></div>
    <h1>
      <span class="gold" data-i18n="hero.title1"></span><br>
      <span data-i18n="hero.title2"></span>
    </h1>
    <p data-i18n="hero.desc"></p>
    <div class="hero-btns">
      <a href="#products" class="btn btn-primary" data-i18n="hero.btnShop"></a>
      <a href="#contact" class="btn btn-outline" data-i18n="hero.btnContact"></a>
    </div>
  </div>
</section>

<!-- ABOUT -->
<section class="section about" id="about">
  <div class="section-title">
    <h2><span class="gold" data-i18n="about.title"></span></h2>
    <div class="divider"></div>
    <p data-i18n="about.subtitle"></p>
  </div>
  <div class="about-content">
    <div class="about-text">
      <h3><span class="gold">SHAMIKH</span></h3>
      <p data-i18n="about.p1"></p>
      <p data-i18n="about.p2"></p>
    </div>
    <div class="about-image">
      <div class="placeholder">
        <div class="icon">👔</div>
        <p>SHAMIKH</p>
        <p style="font-size:12px;color:#666">استبدل هذه الصورة بصورة البراند</p>
      </div>
    </div>
  </div>
</section>

<!-- PRODUCTS -->
<section class="section products" id="products">
  <div class="section-title">
    <h2><span class="gold" data-i18n="products.title"></span></h2>
    <div class="divider"></div>
    <p data-i18n="products.subtitle"></p>
  </div>
  <div class="products-grid" id="products-grid"></div>
</section>

<!-- CONTACT -->
<section class="section contact" id="contact">
  <div class="section-title">
    <h2><span class="gold" data-i18n="contact.title"></span></h2>
    <div class="divider"></div>
    <p data-i18n="contact.subtitle"></p>
  </div>
  <div class="contact-content">
    <div class="contact-info">
      <p data-i18n="contact.desc"></p>
      <div class="contact-item">
        <div class="icon">📞</div>
        <div class="text">
          <strong data-i18n="contact.phone"></strong>
          <span>01141351725</span>
        </div>
      </div>
      <div class="contact-item">
        <div class="icon">✉️</div>
        <div class="text">
          <strong data-i18n="contact.email"></strong>
          <span>shamikh.eg@gmail.com</span>
        </div>
      </div>
      <div class="contact-item">
        <div class="icon">📍</div>
        <div class="text">
          <strong data-i18n="contact.address"></strong>
          <span>القاهرة، مصر</span>
        </div>
      </div>
    </div>
    <form class="contact-form" onsubmit="submitContact(event)">
      <input type="text" id="contact-name" data-i18n-placeholder="contact.formNamePlaceholder" required>
      <input type="email" id="contact-email" data-i18n-placeholder="contact.formEmailPlaceholder" required>
      <textarea id="contact-msg" data-i18n-placeholder="contact.formMsgPlaceholder" required></textarea>
      <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="contact.formSend"></button>
    </form>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="social-links">
    <a href="https://wa.me/201141351725" target="_blank" title="WhatsApp">📱</a>
    <a href="https://instagram.com" target="_blank" title="Instagram">📸</a>
    <a href="https://facebook.com" target="_blank" title="Facebook">👍</a>
    <a href="mailto:shamikh.eg@gmail.com" title="Email">✉️</a>
  </div>
  <p data-i18n="footer.rights"></p>
</footer>

<!-- CART MODAL -->
<div class="modal-overlay" id="cart-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 data-i18n="cart.title"></h2>
      <button class="modal-close" onclick="closeCart()">&times;</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-empty" id="cart-empty" data-i18n="cart.empty"></div>
    <div class="cart-total">
      <span data-i18n="cart.total"></span>
      <span class="amount" id="cart-total-amount">0 ج.م</span>
    </div>
    <button class="btn btn-primary" id="checkout-btn" onclick="checkout()" style="width:100%;display:none" data-i18n="cart.checkout"></button>
    <div id="checkout-section" style="display:none;margin-top:20px">
      <div class="checkout-form">
        <h3 data-i18n="cart.checkout"></h3>
        <input type="text" id="order-name" data-i18n-placeholder="orderform.namePlaceholder" required>
        <input type="tel" id="order-phone" data-i18n-placeholder="orderform.phonePlaceholder" required>
        <textarea id="order-address" data-i18n-placeholder="orderform.addressPlaceholder" rows="3" required></textarea>
        <textarea id="order-notes" data-i18n-placeholder="orderform.notesPlaceholder" rows="2"></textarea>
        <button class="btn-checkout" onclick="submitOrder()" data-i18n="cart.placeOrder"></button>
      </div>
    </div>
  </div>
</div>

<!-- PRODUCT DETAIL MODAL -->
<div class="modal-overlay product-detail-modal" id="product-detail-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 data-i18n="products.viewDetails"></h2>
      <button class="modal-close" onclick="closeProductDetail()">&times;</button>
    </div>
    <div class="product-detail-content" id="product-detail-content"></div>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="modal-overlay admin-modal" id="admin-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 data-i18n="admin.title"></h2>
      <div style="display:flex;gap:10px">
        <button class="btn btn-outline" onclick="exportOrders()" style="padding:8px 16px;font-size:12px" data-i18n="admin.exportBtn"></button>
        <button class="modal-close" onclick="closeAdmin()">&times;</button>
      </div>
    </div>
    <div class="orders-list" id="orders-list"></div>
  </div>
</div>

<!-- WHATSAPP FLOAT -->
<a href="https://wa.me/201141351725" target="_blank" class="whatsapp-float" title="WhatsApp">
  💬
</a>

<!-- ADMIN BUTTON -->
<button class="admin-btn" onclick="openAdmin()" title="الإدارة">⚙️</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
</body>
</html>
